<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache">
<title>Ringfarer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@400;600;700&family=Saira+Stencil+One&family=Share+Tech+Mono&family=Exo+2:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
  :root {
    color-scheme: dark;
    --void: #020306;
    --steel-hi: #2f2e2b;
    --steel: #222120;
    --steel-lo: #161514;
    --edge: #0b0a08;
    --text: #e6dfcd;
    --muted: #b5ad99;
    --paint: #d99a34;
    --paint-dark: #8a5a1c;
    --rust: #7a3a18;
    --gate: #6cc4e0;
    --danger: #e2553d;
    --ok: #95c46a;
    --noise: none;
    --stencil: "Saira Stencil One", "Saira Condensed", Impact, sans-serif;
    --body: "Saira Condensed", "Arial Narrow", ui-sans-serif, sans-serif;
    --mono: "Share Tech Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  html, body { height: 100%; }
  body {
    margin: 0; overflow: hidden; background: var(--void); color: var(--text);
    font: 17px/1.45 var(--body);
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }
  canvas#game { position: fixed; inset: 0; display: block; }
  [hidden] { display: none !important; }

  #panel {
    position: fixed; inset: 0; display: grid; place-items: center;
    grid-template-columns: minmax(0, 1fr); justify-items: center;
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
    background: radial-gradient(ellipse at center, rgba(2, 3, 6, 0.4), rgba(2, 3, 6, 0.85));
    overflow-y: auto; touch-action: pan-y; z-index: 5;
  }
  #panel[data-panel="title"] { background: linear-gradient(90deg, rgba(2, 3, 6, 0.92) 0%, rgba(2, 3, 6, 0.6) 55%, rgba(2, 3, 6, 0.1) 100%); justify-items: start; }

  /* Stålplate: gradient, støy, avfaset kant, nagler i hjørnene. */
  .plate {
    position: relative;
    background:
      radial-gradient(circle at 12px 12px, #b8b09c 0 1px, #6e675a 1.5px, #1a1815 3px, transparent 3.5px),
      radial-gradient(circle at calc(100% - 12px) 12px, #b8b09c 0 1px, #6e675a 1.5px, #1a1815 3px, transparent 3.5px),
      radial-gradient(circle at 12px calc(100% - 12px), #b8b09c 0 1px, #6e675a 1.5px, #1a1815 3px, transparent 3.5px),
      radial-gradient(circle at calc(100% - 12px) calc(100% - 12px), #b8b09c 0 1px, #6e675a 1.5px, #1a1815 3px, transparent 3.5px),
      radial-gradient(ellipse at 90% 100%, rgba(122, 58, 24, 0.18), transparent 45%),
      var(--noise),
      linear-gradient(160deg, var(--steel-hi), var(--steel) 45%, var(--steel-lo));
    background-size: auto, auto, auto, auto, auto, 256px 256px, auto;
    border: 2px solid var(--edge);
    box-shadow: inset 1px 1px 0 rgba(255, 238, 205, 0.14), inset -1px -1px 0 rgba(0, 0, 0, 0.6), 0 10px 40px rgba(0, 0, 0, 0.6);
  }

  .card {
    width: min(720px, 100%); padding: 26px 26px 22px;
    clip-path: polygon(16px 0, 100% 0, 100% calc(100% - 16px), calc(100% - 16px) 100%, 0 100%, 0 16px);
    display: flex; flex-direction: column; gap: 14px; max-height: calc(100dvh - 32px);
    min-width: 0; box-sizing: border-box;
    overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
  }
  .card > * { flex-shrink: 0; }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .card-head h2 { margin: 0; }
  .card.narrow { width: min(420px, 100%); }
  .card.map-card { width: min(1040px, 100%); }
  .st-level .lvl-bar { height: 10px; background: #0c0b09; border: 1px solid rgba(0,0,0,0.6); margin: 6px 0 8px; }
  .st-level .lvl-bar i { display: block; height: 100%; background: linear-gradient(90deg, #6cc4e0, #95c46a); }
  .st-level .perks { list-style: none; padding: 0; margin: 12px 0 0; display: grid; gap: 8px; }
  .st-level .perks li { padding: 8px 10px; border: 1px solid rgba(0,0,0,0.5); background: rgba(0,0,0,0.2); opacity: 0.6; }
  .st-level .perks li.done { opacity: 1; border-color: rgba(149,196,106,0.6); }
  .st-level .row { flex-wrap: wrap; gap: 8px; }
  .btn.cam-follow { position: fixed; right: 12px; top: 100px; z-index: 5; padding: 4px 9px; font-size: 11px; letter-spacing: 0.08em; min-height: 0; line-height: 1.4; }
  .btn.cam-follow kbd { font-size: 10px; opacity: 0.7; margin-left: 4px; }
  .btn.cam-follow.touch kbd { display: none; }
  .vol-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .vol-row .btn { min-width: 52px; }
  .map-wrap { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-start; }
  .map-view { flex: 1 1 420px; min-width: 0; max-width: 560px; display: flex; flex-direction: column; gap: 6px; }
  .map-view canvas { width: 100%; aspect-ratio: 1 / 1; border: 1px solid rgba(0,0,0,0.6); background: #05070a; cursor: grab; }
  .map-view canvas:active { cursor: grabbing; }
  .map-tools { display: flex; gap: 6px; flex-wrap: wrap; }
  .map-tools .btn { padding: 6px 12px; min-width: 40px; }
  .map-view p { margin: 0; }
  .map-sys { flex: 1 1 280px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .map-sys .sys { padding: 10px 12px; border: 1px solid rgba(0,0,0,0.5); background: rgba(0,0,0,0.22); }
  .map-sys .sys.here { border-color: var(--ok); }
  .map-sys h3 { margin: 0 0 4px; }
  .map-sys .buy { font-size: 13px; line-height: 1.5; }
  .map-sys .hi { color: var(--ok); } .map-sys .lo { color: #e3a03a; } .map-sys .dz { color: #e2553d; }
  .card.danger { --steel-hi: #3a2520; --steel: #261915; }

  /* Varselstriper langs toppen av et panel. */
  .hazard { height: 8px; margin: -26px -26px 4px; background: repeating-linear-gradient(-45deg, var(--paint) 0 12px, #16140f 12px 24px); opacity: 0.8;
    -webkit-mask-image: linear-gradient(90deg, #000 70%, rgba(0,0,0,0.4)); mask-image: linear-gradient(90deg, #000 70%, rgba(0,0,0,0.4)); }

  h1 {
    font: 400 clamp(36px, min(10vw, 9vh), 72px)/0.9 var(--stencil); letter-spacing: 0.03em; margin: 0; white-space: nowrap;
    text-transform: uppercase; color: #d8cfb9;
    text-shadow: 0 2px 0 #000, 0 0 30px rgba(217, 154, 52, 0.25);
  }
  h1::after { content: ""; display: block; width: 2.4em; height: 8px; margin-top: 14px; background: repeating-linear-gradient(-45deg, var(--paint) 0 10px, #16140f 10px 20px); }
  h2 { font: 400 30px/1.05 var(--stencil); margin: 0; text-wrap: balance; letter-spacing: 0.03em; text-shadow: 0 2px 0 #000; }
  h3 { font: 700 14px/1 var(--body); letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); margin: 8px 0 0; }
  p { margin: 0; }
  .lede { max-width: 58ch; color: #cfc7b3; text-shadow: 0 1px 0 #000; }
.version { font-size: 13px; color: var(--muted); letter-spacing: 0.08em; }
  .eyebrow { font: 700 13px/1 var(--body); letter-spacing: 0.18em; text-transform: uppercase; color: var(--paint); }
  .muted { color: var(--muted); }
  .small { font-size: 15px; }
  .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .row.end { justify-content: flex-end; }
  .col { display: flex; flex-direction: column; gap: 10px; }

  /* Knapper: preget metallplate, trykkes inn. */
  .btn {
    font: 700 15px/1 var(--body); letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--text); padding: 12px 18px; cursor: pointer;
    background: linear-gradient(180deg, #4d4a42, #2c2a25 60%, #23211d);
    border: 2px solid var(--edge);
    box-shadow: inset 0 1px 0 rgba(255, 238, 205, 0.22), inset 0 -2px 0 rgba(0, 0, 0, 0.5), 0 2px 0 #000;
    text-shadow: 0 1px 0 #000;
  }
  .btn:hover:not(:disabled) { background: linear-gradient(180deg, #5a564c, #34312b 60%, #28261f); }
  .btn:active:not(:disabled) { transform: translateY(1px); box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.6); }
  .btn:focus-visible { outline: 2px solid var(--paint); outline-offset: 2px; }
  .btn.primary {
    color: #1b1206; text-shadow: 0 1px 0 rgba(255, 220, 160, 0.4);
    background:
      radial-gradient(ellipse at 90% 80%, rgba(80, 40, 10, 0.5), transparent 50%),
      linear-gradient(180deg, #e9ac48, var(--paint) 55%, #a76b1f);
    background-size: auto, auto;
  }
  .btn.ghost { background: rgba(0, 0, 0, 0.25); }
  .btn.sm { padding: 8px 11px; font-size: 13px; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .keys { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 6px 18px; font-size: 16px; }
  .keys .k { display: flex; gap: 10px; align-items: center; }
  .keys .k > span:first-child { display: flex; gap: 4px; min-width: 92px; }
  kbd { font: 400 12px/1 var(--mono); padding: 5px 6px; border: 1px solid #000; border-bottom-width: 3px; background: linear-gradient(#4a473f, #2a2823); color: var(--text); }
  .tips { margin: 0; padding-left: 18px; display: grid; gap: 8px; max-width: 70ch; }
  .tips b { color: var(--paint); font-weight: 700; }

  /* Stasjonen: faner til venstre på store skjermer, rutenett av ikoner på mobil. */
  .station { width: min(980px, 100%); height: min(780px, calc(100dvh - 32px)); overflow: hidden; gap: 12px; }
  .st-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .st-title { min-width: 0; }
  .wallet { display: flex; align-items: center; gap: 10px; padding: 8px 10px 8px 14px; background: #0c0b09; border: 1px solid #000; box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.8); }
  .wallet .num { font-size: 24px; color: var(--paint); line-height: 1; text-shadow: 0 0 10px rgba(217, 154, 52, 0.4); }
  .wallet .muted { font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; }
  .chips { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
  .chip { position: relative; display: flex; justify-content: space-between; align-items: baseline; gap: 6px; padding: 7px 10px 9px; background: #12110f; border: 1px solid #000; overflow: hidden; }
  .chip span { font: 700 11px/1 var(--body); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
  .chip b { font-size: 13px; font-weight: 400; color: var(--text); white-space: nowrap; }
  .chip i { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--paint); opacity: 0.75; }
  .st-main { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: 180px minmax(0, 1fr); gap: 10px; }
  .st-head, .chips, .st-foot { flex-shrink: 0; }
  .tabs { display: flex; flex-direction: column; gap: 4px; }
  .tab {
    display: flex; align-items: center; gap: 10px; text-align: left;
    font: 700 14px/1 var(--body); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted);
    padding: 12px 12px; cursor: pointer; white-space: nowrap;
    background: linear-gradient(90deg, #2e2b26, #1c1a17); border: 1px solid var(--edge); border-left: 4px solid #3f3b33;
    box-shadow: inset 0 1px 0 rgba(255, 238, 205, 0.1);
  }
  .tab:hover { color: var(--text); }
  .tab.on { color: #f3d9a4; border-left-color: var(--paint); background: linear-gradient(90deg, rgba(217, 154, 52, 0.3), #1c1a17); }
  .tab:focus-visible { outline: 2px solid var(--paint); }
  .ico { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .tab-body { min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding: 12px; touch-action: pan-y;
    background: rgba(6, 6, 5, 0.75); border: 1px solid #000; box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.8); }
  .st-foot { display: flex; justify-content: flex-end; }
  @media (max-width: 720px) {
    #panel[data-panel="station"] { padding: 0; }
    .station { width: 100%; height: 100dvh; max-height: 100dvh; clip-path: none; border: 0; padding: max(12px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom)); gap: 10px; }
    .station .hazard { margin: -12px -12px 2px; }
    .station h2 { font-size: 24px; }
    .st-head { flex-wrap: nowrap; align-items: flex-end; }
    .catchips { flex-wrap: nowrap; overflow-x: auto; gap: 4px; }
    .catchip { padding: 7px 9px; font-size: 10px; letter-spacing: 0.08em; flex: none; }
    .st-title .eyebrow { font-size: 10px; letter-spacing: 0.12em; }
    .wallet { flex-direction: column; align-items: flex-end; gap: 2px; padding: 6px 8px; }
    .wallet .num { font-size: 17px; }
    .wallet .muted { font-size: 9px; }
    .wallet .btn { padding: 4px 8px; font-size: 11px; }
    .chips { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; }
    .chip { flex-direction: column; gap: 3px; padding: 5px 6px 7px; }
    .chip span { font-size: 9px; letter-spacing: 0.08em; }
    .chip b { font-size: 11px; }
    .st-main { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); gap: 8px; }
    .tabs { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 3px; }
    .tab { flex-direction: column; justify-content: center; gap: 4px; padding: 7px 2px; font-size: 8.5px; letter-spacing: 0.04em; border-left-width: 1px; border-bottom: 3px solid #3f3b33; }
    .tab.on { border-bottom-color: var(--paint); background: linear-gradient(180deg, rgba(217, 154, 52, 0.3), #1c1a17); }
    .st-foot .btn { width: 100%; }
  }

  /* Utstyr: kategorier og kort */
  .news { text-align: left; margin: 14px 0 4px; padding: 10px 14px; background: rgba(10, 10, 9, 0.7); border: 1px solid #000; border-left: 3px solid var(--paint); max-height: 34vh; overflow-y: auto; }
  .news h3 { margin: 8px 0 4px; font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; color: #f3d9a4; }
  .news h3:first-child { margin-top: 0; }
  .news ul { margin: 0 0 6px; padding-left: 18px; }
  .news li { font-size: 13.5px; line-height: 1.4; color: var(--text); margin: 2px 0; }
  .linkbtn { background: none; border: 0; padding: 0; font: inherit; color: #f3d9a4; text-decoration: underline; cursor: pointer; }
  #update-note { position: fixed; right: 10px; top: 104px; z-index: 40; display: flex; align-items: center; gap: 8px; max-width: 290px; padding: 7px 8px 7px 12px;
    background: rgba(12, 14, 12, 0.92); border: 1px solid #000; border-left: 3px solid #7affc8; color: var(--text); font-size: 12px; box-shadow: 0 4px 14px rgba(0,0,0,0.5); }
  #update-note span { display: flex; flex-direction: column; gap: 2px; }
  #update-note small { color: var(--muted); font-size: 11px; }
  #update-note .x { background: none; border: 0; color: var(--muted); font-size: 14px; cursor: pointer; padding: 2px 4px; }
  #update-note[hidden] { display: none; }
  .yard-grid { list-style: none; margin: 10px 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; }
  .mission.yard-card { flex-direction: column; align-items: stretch; gap: 0; padding: 0; overflow: hidden; border-top: 3px solid var(--lc); }
  .mission.yard-card.mine { box-shadow: 0 0 0 2px var(--lc) inset; }
  .yard-card .yard-ship { display: block; width: 100%; height: 150px; background: #05070a; }
  .yard-card .yc-body { display: flex; flex-direction: column; gap: 6px; padding: 10px 12px 12px; }
  .yard-card .yc-head { display: flex; flex-direction: column; gap: 2px; }
  .yard-card .yc-head b { font-size: 17px; }
  .yard-card .yc-tier { font: 700 11px/1 var(--body); letter-spacing: 0.12em; text-transform: uppercase; color: var(--lc); }
  .yard-card p { margin: 0; line-height: 1.35; }
  .yc-facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; margin: 0; }
  .yc-facts div { background: #12110f; border: 1px solid #000; padding: 4px 6px; }
  .yc-facts dt { font: 700 9.5px/1 var(--body); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  .yc-facts dd { margin: 3px 0 0; font-size: 12.5px; }
  .traits { display: flex; flex-direction: column; gap: 3px; }
  .trait { font-size: 12px; color: var(--muted); line-height: 1.3; padding-left: 8px; border-left: 2px solid var(--lc); }
  .trait b { color: var(--text); font-weight: 700; }
  .line-bonus { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; margin: 10px 0 6px; padding: 8px 12px; background: #12110f; border-left: 3px solid var(--lc); }
  .line-bonus b { color: var(--lc); text-transform: uppercase; letter-spacing: 0.1em; font-size: 12px; }
  .line-bonus span { font-size: 13px; }
  .catchip[style*="--lc"].on { border-bottom-color: var(--lc); color: var(--lc); }
  .catchips { flex: none; display: flex; flex-wrap: wrap; gap: 6px; position: sticky; top: -12px; z-index: 2; margin: 0 -12px; padding: 8px 12px; background: rgba(8, 8, 7, 0.96); border-bottom: 1px solid #000; }
  .catchip { font: 700 12px/1 var(--body); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); padding: 8px 12px; cursor: pointer;
    background: #1d1b18; border: 1px solid #000; border-bottom: 2px solid #3f3b33; }
  .catchip.on { color: #f3d9a4; border-bottom-color: var(--paint); background: linear-gradient(180deg, rgba(217, 154, 52, 0.25), #1d1b18); }
  .gear-grid { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px; }
  .mission.gear-card { flex-direction: column; align-items: stretch; gap: 8px; }
  .mission.gear-card > div.gc-top { display: flex; flex-direction: row; flex: none; gap: 10px; align-items: center; }
  .mission.gear-card .pal-ico { width: 56px; height: 56px; flex: none; background: #0b0c0d; border: 1px solid #000; }
  .mission.gear-card .gc-name { display: flex; flex-direction: column; gap: 4px; }
  .mission.gear-card p { margin: 0; line-height: 1.35; }
  .mission.gear-card .gc-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: auto; }
  .mission.gear-card .gc-btns { display: flex; gap: 6px; }
  .fitted { font: 700 11px/1 var(--body); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
  .fitted.on { color: var(--ok); }

  /* Beskjed når utstyr kjøpes eller selges */
  .station { position: relative; }
  .toast { position: absolute; left: 50%; bottom: 76px; transform: translateX(-50%); z-index: 3; display: flex; align-items: center; gap: 12px;
    width: min(440px, calc(100% - 24px)); padding: 10px 14px 10px 10px; background: rgba(12, 14, 12, 0.96); border: 1px solid #000;
    border-left: 4px solid var(--ok); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7); animation: toast-in 0.25s ease-out; transition: opacity 0.4s, transform 0.4s; }
  .toast.bad { border-left-color: var(--danger); }
  .toast.gone { opacity: 0; transform: translate(-50%, 10px); pointer-events: none; }
  .toast canvas { width: 96px; height: 72px; flex: none; border: 1px solid #000; }
  .toast div { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .toast b { color: var(--ok); font-size: 16px; }
  .toast.bad b { color: #f09a86; }
  .toast span { color: var(--muted); font-size: 14px; }
  @keyframes toast-in { from { opacity: 0; transform: translate(-50%, 16px); } to { opacity: 1; transform: translate(-50%, 0); } }
  .mission.flash { animation: flash 1s ease-out; }
  @keyframes flash { 0% { box-shadow: inset 0 0 0 2px var(--ok), 0 0 18px rgba(149, 196, 106, 0.5); } 100% { box-shadow: inset 0 1px 0 rgba(255, 238, 205, 0.08); } }
  @media (prefers-reduced-motion: reduce) { .toast, .mission.flash { animation: none; } }

  /* Hovedmeny */
  .title-card { display: flex; flex-direction: column; gap: 18px; width: min(640px, 100%); padding: 24px clamp(8px, 5vw, 64px); max-height: calc(100dvh - 32px); overflow-y: auto; box-sizing: border-box; }
  .menu { display: flex; flex-direction: column; gap: 8px; max-width: 440px; }
  .menu-item { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; text-align: left; padding: 14px 18px; cursor: pointer; color: var(--text); font: inherit;
    background: linear-gradient(90deg, rgba(40, 38, 34, 0.92), rgba(24, 23, 20, 0.6)); border: 1px solid #000; border-left: 4px solid #5a554b;
    box-shadow: inset 0 1px 0 rgba(255, 238, 205, 0.1); transition: border-color 0.15s, transform 0.15s; }
  .menu-item b { font: 700 18px/1 var(--body); letter-spacing: 0.14em; text-transform: uppercase; }
  .menu-item span { font-size: 14px; color: var(--muted); }
  .menu-item:hover, .menu-item:focus-visible { border-left-color: var(--paint); transform: translateX(4px); outline: none; }
  .menu-item.primary { border-left-color: var(--paint); background: linear-gradient(90deg, rgba(217, 154, 52, 0.28), rgba(24, 23, 20, 0.6)); }
  .menu-item.primary b { color: #f3c77a; }
  @media (prefers-reduced-motion: reduce) { .menu-item { transition: none; } .menu-item:hover { transform: none; } }

  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 16px; }
  th { text-align: left; font: 700 12px/1 var(--body); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); padding: 6px 8px; border-bottom: 2px groove #3a372f; }
  td { padding: 8px; border-bottom: 1px solid rgba(0, 0, 0, 0.6); vertical-align: middle; }
  th.num, td.num { text-align: right; white-space: nowrap; }
  /* På smale skjermer blir hver tabellrad et lite kort. */
  @media (max-width: 560px) {
    table, tbody, tr { display: block; }
    thead { display: none; }
    tr { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px 10px; padding: 10px 2px; border-bottom: 1px solid rgba(0, 0, 0, 0.6); }
    td { display: block; padding: 0; border: 0; }
    td:first-child { grid-column: 1 / -1; font-weight: 600; }
    td.num { text-align: left; }
    td[data-l]::before { content: attr(data-l); display: block; font: 700 11px/1.2 var(--body); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
    td.acts { grid-column: 1 / -1; display: flex; gap: 6px; justify-content: flex-end; flex-wrap: wrap; }
    td.acts .btn { margin-left: 0; }
    tr:not(:has(td:nth-child(4))) td.acts { grid-column: 2 / -1; align-self: center; }
  }
  td.acts { text-align: right; white-space: nowrap; }
  td.acts .btn { margin-left: 4px; }
  .dot { display: inline-block; width: 9px; height: 9px; margin-right: 8px; transform: rotate(45deg); box-shadow: 0 0 0 1px #000; }

  .missions, .upgrades { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .mission, .upgrades li {
    display: flex; justify-content: space-between; gap: 12px; align-items: center; padding: 10px 12px; flex-wrap: wrap;
    background: linear-gradient(160deg, #262523, #191817); border: 1px solid #000; box-shadow: inset 0 1px 0 rgba(255, 238, 205, 0.08);
  }
  .mission > div:first-child, .upgrades li > div:first-child { display: flex; flex-direction: column; gap: 3px; flex: 1 1 280px; }
  .mission b { overflow-wrap: anywhere; }
  .mission .muted { font-size: 15px; }
  .m-side { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
  .reward { color: var(--paint); }
  .tag { align-self: flex-start; font: 700 11px/1 var(--body); letter-spacing: 0.14em; text-transform: uppercase; padding: 4px 6px; border: 1px solid #000; background: #3a372f; color: var(--text); }
  .tag.warn { background: repeating-linear-gradient(-45deg, #6a4a16 0 6px, #3a2a0e 6px 12px); color: #ffd99a; }
  .tag.ok { background: #34452a; color: #cfe8b8; }
  .pips { display: inline-flex; gap: 4px; margin: 2px 0; }
  .pips i { width: 20px; height: 6px; background: #0c0b09; box-shadow: inset 0 1px 2px #000; }
  .pips i.on { background: var(--paint); box-shadow: 0 0 6px rgba(217, 154, 52, 0.5); }

  .dests { display: flex; flex-direction: column; gap: 8px; }
  .dest { display: grid; grid-template-columns: auto 1fr; gap: 2px 14px; align-items: center; text-align: left; color: var(--text); padding: 12px 14px; cursor: pointer; font: inherit;
    background: linear-gradient(160deg, #34312b, #1e1c18); border: 2px solid var(--edge); box-shadow: inset 0 1px 0 rgba(255, 238, 205, 0.12); }
  .dest:hover, .dest:focus-visible { border-color: var(--paint); outline: none; }
  .dest .glyphs { grid-row: span 2; display: flex; gap: 3px; }
  .dest-name { font: 400 22px/1.1 var(--stencil); }
  .dest .muted { font-size: 15px; }
  .glyph { width: 20px; height: 20px; fill: none; stroke: var(--paint); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* Berøringskontroller: små, halvgjennomsiktige, samlet nede til høyre. */
  #touch { position: fixed; inset: 0; pointer-events: none; z-index: 4; }
  #touch button {
    pointer-events: auto; font: 700 11px/1 var(--body); letter-spacing: 0.06em; color: var(--text);
    background: linear-gradient(180deg, rgba(77, 74, 66, 0.7), rgba(35, 33, 29, 0.7));
    border: 1.5px solid rgba(0, 0, 0, 0.9); box-shadow: inset 0 1px 0 rgba(255, 238, 205, 0.18); touch-action: none;
    display: grid; place-items: center; padding: 0; text-shadow: 0 1px 0 #000;
  }
  #touch button.on { background: linear-gradient(180deg, rgba(233, 172, 72, 0.9), rgba(167, 107, 31, 0.9)); color: #1b1206; text-shadow: none; }
  /* Styrespaken: en usynlig sone nede til venstre. Sokkelen dukker opp der
     tommelen settes ned. En svak ring viser hvor sonen er. */
  #stick { position: absolute; left: 0; bottom: 0; width: min(46vw, 260px); height: min(40vh, 280px); pointer-events: auto; touch-action: none; }
  #stick .ghost { position: absolute; left: max(22px, env(safe-area-inset-left)); bottom: max(22px, env(safe-area-inset-bottom)); width: 84px; height: 84px; border-radius: 50%;
    border: 1.5px dashed rgba(217, 154, 52, 0.28); display: grid; place-items: center; pointer-events: none; transition: opacity 0.2s; }
  #stick .ghost i { font: 700 9px/1 var(--body); letter-spacing: 0.14em; text-transform: uppercase; font-style: normal; color: rgba(230, 223, 205, 0.32); }
  #stick.active .ghost { opacity: 0; }
  #stick .base, #stick .knob { position: absolute; border-radius: 50%; pointer-events: none; opacity: 0; transition: opacity 0.12s; }
  #stick .base { width: 104px; height: 104px; margin: -52px 0 0 -52px; border: 2px solid rgba(217, 154, 52, 0.5); background: radial-gradient(circle, rgba(0,0,0,0.05), rgba(0,0,0,0.35)); }
  #stick .knob { width: 42px; height: 42px; margin: -21px 0 0 -21px; background: radial-gradient(circle at 35% 35%, #8a8374, #3a372f 60%, #16140f); border: 2px solid #000; }
  #stick.active .base, #stick.active .knob { opacity: 0.9; }
  #stick.thrust .knob { box-shadow: 0 0 16px rgba(233, 172, 72, 0.8); }
  /* Runde ikonknapper med et kort navn under ikonet. */
  #touch .ib { position: relative; width: 46px; height: 46px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
    background: radial-gradient(circle at 35% 30%, rgba(80, 76, 66, 0.62), rgba(28, 26, 22, 0.62)); border: 1px solid rgba(0, 0, 0, 0.7); }
  #touch .ib.sm { width: 42px; height: 42px; }
  #touch .ib svg, #touch .tile svg, #touch .fire svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  #touch .ib.sm svg { width: 16px; height: 16px; }
  #touch .ib i, #touch .tile i { font: 700 7.5px/1 var(--body); letter-spacing: 0.04em; text-transform: uppercase; font-style: normal; opacity: 0.8; max-width: 100%; overflow: hidden; }
  #touch .fire i { font: 700 10px/1 var(--body); letter-spacing: 0.06em; text-transform: uppercase; font-style: normal; }
  #touch .ib.on, #touch .tile.on { background: radial-gradient(circle at 35% 30%, rgba(240, 185, 85, 0.95), rgba(160, 100, 28, 0.95)); color: #1b1206; }
  /* Avtrekkeren nede til høyre viser verktøyet. Til venstre for den: bytt
     verktøy og brems. Over: skann, samle og mer. */
  #touch .fire { position: absolute; right: max(14px, env(safe-area-inset-right)); bottom: max(14px, env(safe-area-inset-bottom)); width: 72px; height: 72px; border-radius: 50%;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    background: radial-gradient(circle at 35% 30%, rgba(160, 70, 40, 0.8), rgba(70, 25, 12, 0.8)); }
  #touch .fire svg { width: 24px; height: 24px; }
  #touch .fire.on { background: radial-gradient(circle, rgba(255, 190, 110, 0.95), rgba(200, 80, 30, 0.95)); color: #1b0a02; }
  .tc-row { position: absolute; right: calc(max(14px, env(safe-area-inset-right)) + 80px); bottom: calc(max(14px, env(safe-area-inset-bottom)) + 4px); display: flex; flex-direction: row; gap: 8px; align-items: flex-end; }
  .tc-acts { position: absolute; right: calc(max(14px, env(safe-area-inset-right)) + 13px); bottom: calc(max(14px, env(safe-area-inset-bottom)) + 82px); display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .tc-winch { position: absolute; right: calc(max(14px, env(safe-area-inset-right)) + 80px); bottom: calc(max(14px, env(safe-area-inset-bottom)) + 58px); display: flex; flex-direction: row; gap: 8px; }
  #touch .ctx { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(max(14px, env(safe-area-inset-bottom)) + 120px); height: 38px; padding: 0 22px; border-radius: 19px;
    font: 700 14px/1 var(--body); letter-spacing: 0.12em; color: #10200a; background: linear-gradient(180deg, #b4e08a, #7aa850); border: 1px solid #000; box-shadow: 0 4px 14px rgba(0,0,0,0.5); }
  #tc-drawer { position: absolute; right: calc(max(14px, env(safe-area-inset-right)) + 66px); bottom: calc(max(14px, env(safe-area-inset-bottom)) + 82px); display: grid; grid-template-columns: repeat(4, 56px); gap: 6px; padding: 8px; pointer-events: auto; z-index: 6; }
  #touch .tile { width: 56px; height: 50px; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
  @media (orientation: portrait) { #tc-drawer { grid-template-columns: repeat(4, 52px); } #touch .tile { width: 52px; } }
  @media (max-height: 520px) {
    #touch .fire { width: 64px; height: 64px; }
    #touch .ib { width: 42px; height: 42px; }
    #touch .ib.sm { width: 38px; height: 38px; }
    .tc-row { right: calc(max(14px, env(safe-area-inset-right)) + 72px); }
    .tc-acts { right: calc(max(14px, env(safe-area-inset-right)) + 11px); bottom: calc(max(14px, env(safe-area-inset-bottom)) + 72px); gap: 6px; }
    #touch .ctx { bottom: max(16px, env(safe-area-inset-bottom)); }
  }

  /* Utstyr */
  .gear-top { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 14px; }
  @media (max-width: 720px) { .gear-top { grid-template-columns: minmax(0, 1fr); } }
  .gear-view { position: relative; min-width: 0; }
  #gear-canvas { display: block; width: 100%; aspect-ratio: 4 / 3; border: 2px solid #000; box-shadow: inset 0 2px 8px #000; touch-action: none; cursor: grab; }
  .gv-btns { position: absolute; top: 8px; right: 8px; display: flex; gap: 4px; }
  .gv-btns .btn { min-width: 36px; padding: 7px 9px; font-size: 15px; }
  .gv-btns .btn.ghost { font-size: 11px; }
  .gv-zoom { position: absolute; left: 10px; bottom: 8px; font-size: 11px; color: var(--muted); pointer-events: none; }
  .mission.gear { flex-wrap: nowrap; }
  .mission.gear > div:nth-child(2) { display: flex; flex-direction: column; gap: 3px; flex: 1 1 240px; min-width: 0; }
  .mission.gear .pal-ico { width: 56px; height: 56px; flex: none; background: #0b0c0d; border: 1px solid #000; }
  @media (max-width: 560px) { .mission.gear { flex-wrap: wrap; } }
  /* Paletter og tall (brukt av utstyrslisten) */
  .builder { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 14px; }
  @media (max-width: 720px) { .builder { grid-template-columns: minmax(0, 1fr); } }
  .ed-wrap { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  #ed-canvas { display: block; max-width: 100%; border: 2px solid #000; box-shadow: inset 0 2px 8px #000; cursor: crosshair; background: #0b0c0d; }
  .ed-side { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .cats { display: flex; flex-wrap: wrap; gap: 4px; }
  .cats .tab { padding: 7px 9px; font-size: 12px; }
  .palette { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
  .pal { display: flex; gap: 8px; align-items: center; text-align: left; padding: 6px; cursor: pointer; color: var(--text); font: inherit; font-size: 14px;
    background: linear-gradient(160deg, #34312b, #1e1c18); border: 2px solid var(--edge); }
  .pal.on { border-color: var(--paint); box-shadow: 0 0 0 1px var(--paint); }
  .pal > span { display: flex; flex-direction: column; line-height: 1.2; }
  .pal .num { color: var(--paint); font-size: 13px; }
  .pal-ico { width: 44px; height: 44px; flex: none; background: #0b0c0d; }
  .stats { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin: 0; font-size: 14px; }
  .stats dt { color: var(--muted); }
  .stats dd { margin: 0; text-align: right; }
  .warn { margin: 0; padding-left: 18px; color: var(--danger); font-size: 14px; }
  .plain { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 15px; }
  /* Lav skjerm (mobil liggende): stasjonsmenyen fyller skjermen, fanene blir
     smale ikoner til venstre, og alt over innholdet krymper. */
  @media (max-height: 560px) and (min-width: 600px) {
    #panel[data-panel="station"] { padding: 0; }
    .station { width: 100%; height: 100dvh; max-height: 100dvh; clip-path: none; border: 0; gap: 6px;
      padding: 8px max(10px, env(safe-area-inset-right)) 8px max(10px, env(safe-area-inset-left)); }
    .station .hazard { display: none; }
    .station h2 { font-size: 20px; }
    .st-head { flex-wrap: nowrap; }
    .st-title .eyebrow { font-size: 9.5px; letter-spacing: 0.12em; }
    .wallet { padding: 4px 8px; gap: 8px; }
    .wallet .num { font-size: 17px; }
    .wallet .btn { padding: 4px 8px; font-size: 11px; }
    .chips { gap: 4px; }
    .chip { padding: 4px 8px 6px; }
    .chip span { font-size: 9.5px; }
    .chip b { font-size: 11.5px; }
    .st-main { grid-template-columns: 52px minmax(0, 1fr); gap: 6px; }
    .tabs { gap: 3px; overflow-y: auto; }
    .tab { justify-content: center; padding: 8px 4px; border-left-width: 3px; }
    .tab span { display: none; }
    .tab-body { padding: 8px 10px; gap: 8px; }
    .st-foot .btn { padding: 8px 16px; font-size: 13px; }
    td { padding: 5px 8px; }
  }
  /* Veilederen: tips øverst i stasjonsmenyen, og en knapp som pulserer. */
  .guide-tip { padding: 9px 12px; background: rgba(217, 154, 52, 0.14); border-left: 3px solid var(--paint); font-size: 15px; }
  .guide-tip b { color: #f3d9a4; }
  #touch .ib.hint { animation: hint 1.1s ease-in-out infinite; }
  @keyframes hint { 0%, 100% { box-shadow: 0 0 0 0 rgba(233, 172, 72, 0.9); } 50% { box-shadow: 0 0 0 9px rgba(233, 172, 72, 0); } }
  .quick { margin: 0; padding-left: 22px; display: grid; gap: 6px; font-size: 16px; }
  .quick li::marker { color: var(--paint); font-weight: 700; }
  .quick b { color: #f3d9a4; }
  details.tip { background: rgba(0, 0, 0, 0.22); border: 1px solid rgba(0, 0, 0, 0.5); border-left: 3px solid #5a554b; }
  details.tip[open] { border-left-color: var(--paint); }
  details.tip summary { cursor: pointer; padding: 8px 12px; font: 700 14px/1.2 var(--body); letter-spacing: 0.1em; text-transform: uppercase; color: var(--text); }
  details.tip p { padding: 0 12px 10px; color: #cfc7b3; font-size: 15px; }
  details.tip .keys { padding: 0 12px 10px; }
  .help-card .tips { display: grid; gap: 4px; }
  .row.two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .vol-row .grow { flex: 1; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } #touch .ib.hint { animation: none; outline: 2px solid var(--paint); } }

  /* Mobil: markedet som kompakte rader (navn og knapper på én linje, tall under). */
  @media (max-width: 560px) {
    .tab-body tr { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px 8px; padding: 8px 2px; }
    .tab-body td:first-child { grid-column: 1 / 3; align-self: center; }
    .tab-body td.acts { grid-column: 3 / 4; grid-row: 1; justify-content: flex-end; flex-wrap: nowrap; }
    .tab-body td.acts .btn { padding: 6px 8px; font-size: 12px; }
    .tab-body td[data-l] { font-size: 13px; }
    .tab-body td[data-l]::before { display: inline; margin-right: 4px; font-size: 9.5px; }
    .station .wallet .muted { display: none; }
    .station .wallet { flex-direction: row; align-items: center; padding: 6px 8px; }
    .station h2 { font-size: 22px; }
    .station .chips { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; }
    .station .chip { padding: 5px 6px 6px; }
    .station .chip span { font-size: 8.5px; }
    .station .chip b { font-size: 11px; }
  }
  /* ================= Tema v2: mørkt romglass =================
     Erstatter stålplater, nagler og varselstriper med rolige glassflater,
     én aksentfarge (cyan) og gull bare for penger. Overstyrer reglene over. */
  :root {
    --void: #05080f; --bg1: #0a1120; --bg2: #0e1829; --line: rgba(120, 180, 255, 0.14); --line2: rgba(120, 180, 255, 0.28);
    --text: #e8f0ff; --muted: #8fa3bf; --paint: #4fd1ff; --paint-dark: #1b6f8f; --gold: #ffc35a;
    --gate: #4fd1ff; --danger: #ff5d6c; --ok: #5be3a6;
    --body: "Inter", system-ui, sans-serif; --stencil: "Exo 2", "Inter", sans-serif; --mono: "Share Tech Mono", ui-monospace, monospace;
  }
  body { font: 15px/1.5 var(--body); }
  #panel { background: radial-gradient(ellipse at 50% 30%, rgba(10, 20, 40, 0.55), rgba(3, 5, 10, 0.88)); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
  #panel[data-panel="title"] { background: linear-gradient(90deg, rgba(3, 6, 12, 0.94) 0%, rgba(3, 6, 12, 0.55) 60%, rgba(3, 6, 12, 0.05) 100%); backdrop-filter: none; }
  .plate { background: linear-gradient(180deg, rgba(16, 26, 44, 0.96), rgba(9, 15, 27, 0.97)); border: 1px solid var(--line2); border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.05); }
  .card { clip-path: none; border-radius: 16px; padding: 22px; }
  .hazard { display: none; }
  h1 { font: 700 clamp(40px, min(10vw, 9vh), 76px)/1 var(--stencil); letter-spacing: 0.06em; color: #f2f7ff;
    text-shadow: 0 0 40px rgba(79, 209, 255, 0.35); }
  h1::after { width: 64px; height: 3px; margin-top: 14px; border-radius: 2px; background: linear-gradient(90deg, var(--paint), transparent); }
  h2 { font: 600 24px/1.15 var(--stencil); letter-spacing: 0.02em; text-shadow: none; }
  h3 { font: 600 11px/1 var(--body); letter-spacing: 0.14em; color: var(--muted); }
  .eyebrow { font: 600 11px/1 var(--body); letter-spacing: 0.16em; color: var(--paint); }
  .lede { color: #b9c8de; text-shadow: none; }
  .btn { font: 600 14px/1 var(--body); letter-spacing: 0.02em; text-transform: none; border-radius: 10px; padding: 11px 16px;
    color: var(--text); background: rgba(120, 180, 255, 0.08); border: 1px solid var(--line2); box-shadow: none; text-shadow: none; }
  .btn:hover:not(:disabled) { background: rgba(120, 180, 255, 0.16); }
  .btn:active:not(:disabled) { transform: translateY(1px); box-shadow: none; }
  .btn.primary { color: #03141c; background: linear-gradient(180deg, #7fe0ff, #33b8e8); border-color: transparent; text-shadow: none; }
  .btn.primary:hover:not(:disabled) { background: linear-gradient(180deg, #a2eaff, #4cc7f2); }
  .btn.ghost { background: transparent; }
  .btn.sm { padding: 7px 11px; font-size: 13px; border-radius: 8px; }
  .btn:focus-visible { outline: 2px solid var(--paint); outline-offset: 2px; }
  /* Startskjermen: midtstilt, rolig. */
  .title-card { gap: 16px; }
  .menu { gap: 10px; }
  .menu-item { border-radius: 12px; border: 1px solid var(--line); border-left: 1px solid var(--line); background: rgba(14, 24, 42, 0.78);
    padding: 14px 16px 14px 56px; position: relative; transition: border-color 0.15s, background 0.15s; }
  .menu-item::before { content: ""; position: absolute; left: 16px; top: 50%; width: 24px; height: 24px; margin-top: -12px; background: var(--paint);
    -webkit-mask: var(--ico) center / contain no-repeat; mask: var(--ico) center / contain no-repeat; opacity: 0.9; }
  .menu-item b { font: 600 16px/1.1 var(--stencil); letter-spacing: 0.04em; text-transform: none; }
  .menu-item span { font-size: 13px; }
  .menu-item:hover, .menu-item:focus-visible { border-color: var(--paint); background: rgba(24, 44, 72, 0.85); transform: none; }
  .menu-item.primary { border-color: rgba(79, 209, 255, 0.55); background: linear-gradient(90deg, rgba(79, 209, 255, 0.16), rgba(14, 24, 42, 0.78)); }
  .menu-item.primary b { color: #bdefff; }
  .news { border-radius: 12px; border: 1px solid var(--line); border-left: 3px solid var(--paint); background: rgba(10, 18, 32, 0.8); }
  .news h3 { color: #bdefff; }
  /* Stasjonen: faner som en rad med ikoner øverst, innhold under. */
  .station { width: min(1040px, 100%); gap: 12px; }
  .st-head { align-items: flex-end; }
  .station h2 { font-size: 26px; }
  .wallet { border-radius: 12px; background: rgba(255, 195, 90, 0.08); border: 1px solid rgba(255, 195, 90, 0.3); box-shadow: none; }
  .wallet .num { color: var(--gold); text-shadow: none; }
  .chips { gap: 8px; }
  .chip { border-radius: 10px; background: rgba(120, 180, 255, 0.06); border: 1px solid var(--line); }
  .chip span { font: 600 10px/1 var(--body); letter-spacing: 0.1em; }
  .chip i { height: 2px; background: var(--paint); border-radius: 2px; }
  .st-main { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); gap: 10px; }
  .tabs { flex-direction: row; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { flex: none; flex-direction: row; gap: 8px; padding: 9px 14px; border-radius: 999px; font: 600 13px/1 var(--body); letter-spacing: 0.02em; text-transform: none;
    color: var(--muted); background: rgba(120, 180, 255, 0.05); border: 1px solid var(--line); box-shadow: none; }
  .tab:hover { color: var(--text); background: rgba(120, 180, 255, 0.1); }
  .tab.on { color: #03141c; background: var(--paint); border-color: var(--paint); }
  .tab-body { border-radius: 14px; background: rgba(4, 8, 16, 0.55); border: 1px solid var(--line); box-shadow: none; }
  .st-foot .btn { min-width: 180px; }
  .ico { stroke-width: 1.7; }
  .mission, .upgrades li { border-radius: 12px; background: rgba(120, 180, 255, 0.05); border: 1px solid var(--line); box-shadow: none; }
  .tag { border-radius: 6px; background: rgba(120, 180, 255, 0.12); border: 0; letter-spacing: 0.08em; font-family: var(--body); }
  .tag.ok { background: rgba(91, 227, 166, 0.16); color: #a9f3d2; }
  .tag.warn { background: rgba(255, 195, 90, 0.16); color: #ffd99a; }
  .reward { color: var(--gold); }
  th { font: 600 11px/1 var(--body); letter-spacing: 0.1em; border-bottom: 1px solid var(--line2); }
  td { border-bottom: 1px solid var(--line); }
  .catchips { background: rgba(6, 11, 20, 0.96); border-bottom: 1px solid var(--line); }
  .catchip { border-radius: 999px; border: 1px solid var(--line); background: rgba(120, 180, 255, 0.05); font-family: var(--body); text-transform: none; letter-spacing: 0.02em; }
  .catchip.on { color: #03141c; background: var(--paint); border-color: var(--paint); }
  kbd { border-radius: 6px; border: 1px solid var(--line2); border-bottom-width: 2px; background: rgba(120, 180, 255, 0.08); }
  details.tip { border-radius: 10px; border: 1px solid var(--line); border-left: 1px solid var(--line); background: rgba(120, 180, 255, 0.04); }
  details.tip[open] { border-color: var(--line2); }
  details.tip summary { font: 600 14px/1.2 var(--body); text-transform: none; letter-spacing: 0.01em; }
  .guide-tip { border-radius: 10px; background: rgba(79, 209, 255, 0.1); border-left: 3px solid var(--paint); }
  .guide-tip b { color: #bdefff; }
  .toast { border-radius: 12px; background: rgba(10, 18, 32, 0.97); border: 1px solid var(--line2); }
  .dest { border-radius: 12px; background: rgba(120, 180, 255, 0.05); border: 1px solid var(--line); box-shadow: none; }
  .dest-name { font: 600 20px/1.1 var(--stencil); }
  .glyph { stroke: var(--paint); }
  .stats dt { color: var(--muted); }
  .quick li::marker { color: var(--paint); }
  .quick b { color: #bdefff; }
  #update-note { border-radius: 10px; background: rgba(10, 18, 32, 0.95); border-left-color: var(--paint); }
  .btn.cam-follow { border-radius: 999px; }
  .map-view canvas { border-radius: 12px; border: 1px solid var(--line); }
  .map-sys .sys { border-radius: 10px; border: 1px solid var(--line); background: rgba(120, 180, 255, 0.04); }
  .yard-card .yc-facts div, .yc-facts div { border-radius: 6px; background: rgba(120, 180, 255, 0.05); border: 1px solid var(--line); }
  .pal { border-radius: 10px; border: 1px solid var(--line); background: rgba(120, 180, 255, 0.05); }
  .pal.on { border-color: var(--paint); box-shadow: 0 0 0 1px var(--paint); }
  .pips i.on { background: var(--paint); box-shadow: 0 0 6px rgba(79, 209, 255, 0.5); }
  .st-level .lvl-bar i { background: linear-gradient(90deg, #4fd1ff, #5be3a6); }
  .trend { margin-left: 4px; font-size: 10px; }
  .trend.up { color: var(--ok); } .trend.down { color: var(--danger); }
  .st-sub { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .stars { color: var(--gold); font-size: 12px; letter-spacing: 1px; }
  .mission.story { border-color: rgba(255, 195, 90, 0.4); background: rgba(255, 195, 90, 0.06); }
  .log-rank { display: flex; flex-direction: column; gap: 4px; padding: 12px 14px; border-radius: 12px; background: rgba(79, 209, 255, 0.07); border: 1px solid var(--line); }
  .log-rank b { font: 600 22px/1.1 var(--stencil); }
  .log-rank .lvl-bar { height: 6px; border-radius: 3px; background: rgba(255,255,255,0.08); overflow: hidden; }
  .log-rank .lvl-bar i { display: block; height: 100%; background: linear-gradient(90deg, #4fd1ff, #5be3a6); }
  .rep-row { display: grid; grid-template-columns: 140px 1fr 70px; gap: 10px; align-items: center; font-size: 14px; }
  .rep-bar { height: 6px; border-radius: 3px; background: rgba(255,255,255,0.08); overflow: hidden; }
  .rep-bar i { display: block; height: 100%; opacity: 0.85; }
  /* Touch-knapper i samme stil. */
  #touch .ib, #touch .tile { background: rgba(10, 18, 32, 0.62); border: 1px solid rgba(120, 180, 255, 0.22); color: #dbe9ff; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
  #touch .ib.on, #touch .tile.on { background: var(--paint); color: #03141c; border-color: var(--paint); }
  #touch .fire { background: radial-gradient(circle at 40% 35%, rgba(255, 120, 110, 0.85), rgba(150, 30, 45, 0.85)); border: 1px solid rgba(255, 150, 150, 0.4); }
  #touch .ctx { color: #03141c; background: linear-gradient(180deg, #7fe0ff, #33b8e8); border: 0; }
  #tc-drawer { border-radius: 16px; }
  #stick .ghost { border-color: rgba(79, 209, 255, 0.3); }
  #stick .base { border-color: rgba(79, 209, 255, 0.55); }
  #stick .knob { background: radial-gradient(circle at 35% 35%, #9fd8ff, #2b5f80 60%, #0b1d2b); border-color: rgba(0, 0, 0, 0.6); }
  @keyframes hint { 0%, 100% { box-shadow: 0 0 0 0 rgba(79, 209, 255, 0.9); } 50% { box-shadow: 0 0 0 9px rgba(79, 209, 255, 0); } }
  @media (max-width: 720px) {
    .st-main { grid-template-rows: auto minmax(0, 1fr); }
    .tabs { display: flex; }
    .tab { flex-direction: row; padding: 8px 12px; font-size: 12px; border-bottom-width: 1px; }
    .tab.on { border-bottom-color: var(--paint); background: var(--paint); }
  }
  @media (max-height: 560px) and (min-width: 600px) {
    .st-main { grid-template-columns: minmax(0, 1fr); }
    .tab { padding: 6px 10px; }
    .tab span { display: inline; }
  }
</style>
</head>
<body>
<canvas id="game" aria-label="Game view"></canvas>

<div id="touch" hidden>
  <!-- Styrespaken er usynlig til man setter tommelen ned nede til venstre. -->
  <div id="stick"><div class="ghost"><i>Steer</i></div><div class="base"></div><div class="knob"></div></div>
  <button id="tc-ctx" class="ctx" data-tap="Interact" hidden></button>
  <div class="tc-acts">
    <button class="ib" data-tap="KeyN" id="tc-scan" data-icon="scan" data-label="Scan"></button>
    <button class="ib" data-tap="KeyF" id="tc-tractor" data-icon="collect" data-label="Collect"></button>
    <button class="ib" id="tc-more" aria-label="More" data-icon="more" data-label="More"></button>
  </div>
  <div class="tc-row">
    <button class="ib sm" id="tc-tool" data-tap="ToolNext" data-icon="laser" data-label="Tool"></button>
    <button class="ib sm" id="tc-brake" data-hold="retro" data-icon="brake" data-label="Brake"></button>
  </div>
  <div class="tc-winch">
    <button class="ib sm" id="tc-winch" data-hold="winch" data-icon="winchIn" data-label="Winch" hidden></button>
    <button class="ib sm" id="tc-winchout" data-hold="winchOut" data-icon="winchOut" data-label="Pay out" hidden></button>
  </div>
  <button id="tc-fire" class="fire" data-hold="fire" data-tap="Fire"></button>
  <div id="tc-drawer" class="plate" hidden>
    <button class="tile" data-tap="KeyL" id="tc-light" data-icon="light" data-label="Lights"></button>
    <button class="tile" data-tap="KeyZ" data-icon="assist" data-label="Assist"></button>
    <button class="tile" data-tap="KeyK" data-icon="drones" data-label="Drones"></button>
    <button class="tile" data-tap="Tab" data-icon="map" data-label="Map"></button>
    <button class="tile" data-tap="KeyB" data-icon="hold" data-label="Hold"></button>
    <button class="tile" data-tap="KeyU" data-icon="scoop" data-label="Scoop"></button>
    <button class="tile" data-tap="KeyY" data-icon="laser" data-label="Laser mode"></button>
    <button class="tile" data-tap="Period" data-icon="time" data-label="Time ×2"></button>
    <button class="tile" data-tap="KeyI" data-icon="photo" data-label="Photo"></button>
    <button class="tile" data-tap="Recenter" data-icon="follow" data-label="Follow"></button>
    <button class="tile" data-tap="Escape" data-icon="pause" data-label="Pause"></button>
  </div>
</div>

<button id="cam-follow" class="btn primary cam-follow" hidden onclick="RF.game.followShip()" title="Camera follows the ship again">◎ Ship <kbd>O</kbd></button>

<div id="panel" hidden></div>

<script>
  // Versjonen står her og brukes i adressen til hver skriptfil (?v=…), så
  // nettlesere henter nye filer når versjonen endres i stedet for gamle kopier.
  window.RF_VERSION = 'v0.28.0 · 2026-10-12';
  (function () {
    var v = encodeURIComponent(window.RF_VERSION.split(' ')[0]);
    var files = ['news', 'geom', 'physics', 'world', 'voxel', 'scan', 'modules', 'classes', 'ship', 'npc', 'pirates', 'stations', 'missions', 'input', 'audio',
      'render', 'sky', 'shipdraw', 'weapons', 'combat', 'planets', 'guide', 'career', 'hud', 'ui', 'game'];
    var i = 0;
    (function next() {
      if (i >= files.length) { RF.game.boot(); return; }
      var sc = document.createElement('script');
      sc.src = 'js/' + files[i++] + '.js?v=' + v;
      sc.onload = next;
      sc.onerror = function () { document.body.insertAdjacentHTML('beforeend', '<p style="color:#e2553d;padding:16px">Could not load ' + sc.src + '. Please reload the page.</p>'); };
      document.body.appendChild(sc);
    })();
  })();
</script>
</body>
</html>
